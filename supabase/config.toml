project_id = "roster"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]

# Authentication is performed inside each handler so OAuth discovery and
# preflight requests can reach the function without a user token.
[functions.api]
verify_jwt = false

[functions.mcp]
verify_jwt = false

# These handlers verify a job token and GitHub HMAC respectively.
[functions.jobs]
verify_jwt = false

[functions.github-webhook]
verify_jwt = false
